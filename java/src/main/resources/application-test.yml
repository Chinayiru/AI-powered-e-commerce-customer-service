spring:
  datasource:
    url: jdbc:h2:mem:aftersale_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8

app:
  demo:
    allow-header-identity: true
  security:
    # 测试 profile 与 dev 使用同一组演示密钥，仅用于 H2 集成测试。
    hmac-secret: ${APP_HMAC_SECRET:dev-only-hmac-secret-change-me-please}
    agent-token: ${APP_AGENT_TOKEN:demo-agent-token}
  agent:
    mode: scripted
  execution:
    mode: SIMULATED
