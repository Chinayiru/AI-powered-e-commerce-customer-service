spring:
  datasource:
    url: jdbc:h2:mem:aftersale_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8

app:
  demo:
    allow-header-identity: true
  security:
    # 离线 H2 测试专用的合成夹具，不能用于 dev/mysql/prod。
    hmac-secret: test-only-hmac-fixture-0123456789abcdef
    agent-token: test-only-agent-fixture-0123456789abcdef
  agent:
    mode: scripted
  execution:
    mode: SIMULATED
