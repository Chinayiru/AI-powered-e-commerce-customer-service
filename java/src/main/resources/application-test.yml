spring:
  datasource:
    url: jdbc:h2:mem:aftersale_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8

app:
  demo:
    allow-header-identity: true
  agent:
    mode: scripted
  execution:
    mode: SIMULATED
