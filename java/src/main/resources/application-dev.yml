spring:
  datasource:
    url: jdbc:h2:mem:aftersale;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.chinayiru.aftersale: INFO

app:
  demo:
    allow-header-identity: true
  security:
    # 仅本地 dev 的演示密钥；生产/联调 profile 不允许回落到这两个值。
    hmac-secret: ${APP_HMAC_SECRET:dev-only-hmac-secret-change-me-please}
    agent-token: ${APP_AGENT_TOKEN:demo-agent-token}
