spring:
  datasource:
    url: jdbc:h2:mem:aftersale;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.chinayiru.aftersale: INFO

app:
  demo:
    allow-header-identity: true
  security:
    # dev 也必须显式注入凭证，仓库不再提供可用于登录/签名的默认值。
    hmac-secret: ${APP_HMAC_SECRET:}
    agent-token: ${APP_AGENT_TOKEN:}
