spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:aftersale}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  demo:
    allow-header-identity: false
  security:
    # 真实部署前必须接入 SSO 并通过环境变量注入两把密钥。
    sso-enabled: ${APP_SSO_ENABLED:false}
    hmac-secret: ${APP_HMAC_SECRET}
    agent-token: ${APP_AGENT_TOKEN}

logging:
  level:
    root: INFO
