spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:aftersale}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      encoding: UTF8
      continue-on-error: false

app:
  demo:
    allow-header-identity: false
  # mysql 不是 dev/test 白名单 profile：启动前必须注入
  # APP_HMAC_SECRET / APP_AGENT_TOKEN（均 >=32 字符），否则 StartupGuard 拒绝启动。
